[package]
name = "discord_bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bot"
path = "src/main.rs"

[[bin]]
name = "selfbot"
path = "src/selfbot.rs"

[[bin]]
name = "export_training"
path = "src/export_training.rs"

[dependencies]
serenity = { version = "0.11", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1.35", features = ["full"] }
dotenv = "0.15"
time = "0.3"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2"
base64 = "0.21"
sha2 = "0.10"
dashmap = "5"
once_cell = "1"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
