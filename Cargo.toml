[package]
name = "discord_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.10", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "unstable_discord_api"] }
tokio = { version = "1.35", features = ["full"] }
dotenv = "0.15"
time = "0.3.36"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
chrono = "0.4"
