[package]
name = "discord_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.10", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "unstable_discord_api"] }
tokio = { version = "1.35", features = ["full"] }
dotenv = "0.15"
time = "0.3.36"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
lazy_static = "1"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2"
base64 = "0.21"
md5 = "0.7"
